# 하네스 규칙 SSOT — 수치·개수·허용 목록은 이 파일에만 둔다.
# docs/design.md · 에이전트 · 가이드는 여기 값을 가리키기만 한다.
# {…} 는 채울 자리. 채우는 방법은 README "시작하기" 참고.
# 게이트 동작 확인용 예시 값은 harness/tests/fixtures/rules.test.yaml 에 있다.
version: 1
service_name: "{서비스명}"

source_of_truth:
  docs: md          # 리포 md 가 정본, 노션은 파생 (인터랙션·체크용)
  product: code     # 앱 리포 코드가 최종 SOT

run:
  slug: "{version}-{domain}[-{topic}]"   # 예: 1.2.0-ux-onboarding · 1.2.0-screenshots · 1.2.0-qa · 1.2.0-events
  dir: runs/{slug}/
  state: runs/{slug}/state.json          # verify.mjs 만 쓴다
  resume: 마지막 통과 단계의 다음 단계부터

domains: [ux, screenshots, qa, events]
out_of_scope: ["{하네스 범위 밖 1}", "{하네스 범위 밖 2}"]

pipeline:
  - { id: P1, name: 수집 }
  - { id: P2, name: 설계, on_fail: P1 }          # 기능·범위 누락
  - { id: P3, name: 제작 }
  - id: HUMAN
    name: 보강·승인
    file: runs/{slug}/approval.md               # 사람만 씀
    invalidated_by: P2·P3 산출물 해시 변경
    on_reject: P2
  - { id: P4, name: 대조, on_fail: P3 }
  - { id: P5, name: 파생 }                       # 이후 노션에서 마지막 검토(비차단)

retry: { max_same_gate_fail: 3, on_exceed: block }   # 사람 보고, 자동 해제 금지

artifacts:                                      # runs/{slug}/ 기준
  P1: { all: p1-collect/scope.md }
  P2:
    ux: [p2-design/references.md, p2-design/screens.md, p2-design/spec.md]
    screenshots: [p2-design/copy.csv]
    qa: [p2-design/items.md]
    events: [p2-design/changes.md]
  P3:
    ux: [p3-make/figma.json]                    # figma-export.figma.js export 모드 출력
    screenshots: [p3-make/raw/*.png, p3-make/out/*.png]
    qa: ["p3-make/qa-{version}.md"]
    events: [p3-make/events.csv, "p3-make/events-{version}.md"]
  HUMAN: { all: approval.md }
  P4: { all: p4-check/report.json }
  P5:                                           # 노션 동기화 로그 · 파생본 · 복사 목록
    ux: [p5-derive/sync-log.md, p5-derive/publish.json]
    screenshots: [p5-derive/publish.json]
    qa: ["p5-derive/qa-{version}-notion.md", p5-derive/sync-log.md, p5-derive/publish.json]
    events: [p5-derive/sync-log.md, p5-derive/publish.json]
    publish_to_app_repo:                        # 정본 복사 위치 (defaults.app_repo 기준)
      qa: "{앱 리포 QA 시트 폴더}/"
      screenshots: "{앱 리포 스토어 이미지 폴더}/"
      events: "{앱 리포 이벤트 시트 폴더}/"

notion_sync:
  trigger: [사용자 요청, md 정본 갱신, 앱 코드 갱신]   # 별도 승인 불필요
  order: [pull_checks_to_md_result_column, push_md_to_notion]

agents: { orchestrator: claude-code, P3: "{P3 담당 — 예: multica}", cross_review: codex }
judge: node harness/scripts/verify.mjs          # 누가 돌려도 같은 판정

# ── 판정 ────────────────────────────────────────────────
# exit 0 통과 · 1 실패/승인 대기 · 2 스크립트 오류 · 3 차단(같은 게이트 3회 실패) · 4 사용자 확인 대기(review_after)
exit_codes: { pass: 0, fail_or_pending: 1, error: 2, blocked: 3, review_wait: 4 }

# 단계 통과 뒤 사용자 확인을 받을 단계 (guard-review hook 이 확인 전 작업 에이전트 호출을 막는다). 예: [P1, P2]
review_after: []

approval:
  file: runs/{slug}/approval.md
  required_lines: ["approved: yes", "inputs_sha256: <P2·P3 산출물 해시>"]
  writer: human_only            # 에이전트 쓰기는 hook 으로 차단
  invalid_if: inputs_sha256 != 현재 P2·P3 해시

# 키워드 검사는 카피·화면 텍스트 열에만 적용 ("~하지 않는다" 류 설명 문장 오탐 방지)
text_scope:
  ux: [screens.md 텍스트 열, spec.md 카피 열, figma.json TEXT 노드]
  screenshots: [copy.csv headline·sub 열, p3-make/raw·out PNG OCR]
  qa: [항목 표 항목 열]

# 사전 항목은 JS 정규식. 기본은 대소문자 구분, 앞에 (?i) 를 붙이면 무시.
# ★A · ★B = docs/story-service.md 의 "어기면 안 되는 것" A · B
dictionaries:
  a_forbidden: ["{★A 를 어기는 표현 정규식}"]
  a_signal: ["{★A 를 지킨다는 신뢰 신호 정규식}"]
  b_forbidden: ["{★B 를 어기는 표현 정규식}"]
  legacy_feature: ["{폐기된 기능 문구 정규식}"]
  personal_data:
    - "[\\w.+-]+@[\\w-]+\\.[a-z]{2,}"                          # 이메일
    - "{실명·기기명 등 개인정보 정규식}"

design_tokens:      # 출처: docs/design.md. 값을 채운 뒤 design.md 와 맞는지 확인
  colors: ["{#RRGGBB}"]
  forbidden_colors: ["{#RRGGBB — 산출물에 나오면 안 되는 색}"]
  spacing: ["{간격 토큰}"]
  radius: ["{모서리 토큰}"]
  radius_pill: ["{캡슐 최소}", "{캡슐 최대}"]
  radius_panel: "{패널 모서리}"
  font_size: ["{글자 크기 단계}"]
  cta: { layer_suffix: ".cta", height: "{CTA 높이}" }
  brand_forbidden: ["{쓰면 안 되는 옛 표기}"]

# 산출물 형식 — verify.mjs 가 읽는 열 이름. 템플릿은 harness/templates/
formats:
  scope_ux: "| ID | 기능 | 근거 |              (ID = F-01 …)"
  scope_qa: "| 영역 | 섹션 | 근거 |             (섹션 = qa 시트 섹션 코드)"
  references: "| # | 앱 | 화면 | 출처 URL | 반영 포인트 |"
  screens: "| 화면 | 흐름 | 기능 ID | 텍스트 |     (흐름: star_flows 값 또는 기타, 기능 ID 쉼표 구분)"
  spec: "카피 열이 있는 표"
  copy_csv: "platform,slot,lang,headline,sub,feature_id,headline_lines   (platform = spec.platforms 키, headline 줄바꿈은 \\n)"
  qa_sheet: "머리 '상태: N항목 (P0 a / P1 b / P2 c)' · '# X. 섹션' · | ID | 항목 | 절차 | 기대 | 우선 | 결과 |"
  figma_json: "{ file_key, frame_ids: [], nodes: [{ id, name, type, fills[], spacing[], radius[], fontSize, text, height }] } — figma-export.figma.js export 모드 출력"
  sync_log: "sync-log.md 에 'notion_items: N' 한 줄"
  scope_events: "| ID | 키 스펙 | 근거 |  (ID = K-01 …) + event-tools drift 출력 절"
  changes_events: "| 구분 | event_name | category | 설명 | properties | platform | purpose | 스펙 ID |  (구분: 추가·변경·소거·측정 안 함, 셀 안 | 는 \\|)"
  delivery_events: "events-{version}.md — '## 목적' '## 퍼널' '## 질문' '## 커버리지' 절"
  analytics_live: "{ range_days: N, events: { <event_name>: <count> } }"

star_flows: ["{★ 조건을 검사할 흐름 이름}"]        # ★A2·B1·B2 가 보는 screens.md 흐름
b_screen: "{★B 를 어기는 화면 이름 정규식}"

unblock:
  file: runs/{slug}/unblock.md       # 사람만 씀. blocked_at 이후 수정되면 실패 횟수 초기화

gates:
  common:
    - { id: ART, stage: 모든 단계, check: "artifacts 파일 전부 존재 (glob 은 1개 이상)" }
    - { id: APPROVAL, stage: "HUMAN·P4", check: "approval.md 에 approved: yes, inputs_sha256 = 현재 P2·P3 해시", on_fail: pending }
    - { id: A1, star: A, stage: P4, check: "text_scope 내 a_forbidden 매칭 = 0", on_fail: P2 }
    - { id: A2, star: A, stage: P4, check: "ux star_flows 흐름마다 / screenshots (platform×lang) 세트마다 a_signal >= 1", on_fail: P2 }
    - { id: B1, star: B, stage: P4, check: "ux star_flows 흐름 텍스트 · screenshots 카피의 b_forbidden 매칭 = 0", on_fail: P2 }
    - { id: B2, star: B, stage: P4, check: "ux screens.md star_flows 흐름의 b_screen 매칭 화면 = 0", on_fail: P2 }
  ux:
    - { id: U1, stage: P2, check: "references 행 >= 5, 행마다 http(s) URL", on_fail: P1 }
    - { id: U2, stage: P2, check: "scope.md 기능 ID 중 screens.md 미매핑 = 0", on_fail: P1 }
    - { id: U3, stage: P4, check: "figma fills 중 colors 밖 또는 forbidden_colors = 0", on_fail: P3 }
    - { id: U4, stage: P4, check: "figma spacing ∉ spacing = 0, radius ∉ radius · radius_pill 범위(panel 노드는 radius_panel 허용) = 0, fontSize ∉ font_size = 0", on_fail: P3 }
    - { id: U5, stage: P4, check: "*.cta 노드 height != cta.height = 0", on_fail: P3 }
    - { id: U6, stage: P4, check: "figma TEXT · screens · spec 카피의 brand_forbidden = 0", on_fail: P3 }
    - { id: U7, stage: P4, check: "figmaDigest(p3-make/figma.json) = --figma-digest (judge 가 verify --figma-code 코드를 use_figma 로 그대로 돌린 지문), file_key = init 때 받은 Figma 파일", on_fail: P3 }
  screenshots:
    spec:
      platforms:                     # 파일명 정규식의 첫 캡처 = 언어
        "{플랫폼 A}": { size: ["{가로}", "{세로}"], count: ["{최소}", "{최대}"], name: "^({언어 코드들})-{파일명 규칙}\\.png$" }
      required_langs: ["{필수 언어}"]
      status_time: ["{캡처 상태바 시각}"]
      no_em_dash_langs: ["{em dash 금지 언어}"]
      no_emoji_platforms: ["{이모지 금지 플랫폼}"]
    checks:
      - { id: S1, stage: P4, check: "out/ PNG 파일명·픽셀 크기·(platform×lang) 장수 = spec", on_fail: P3 }
      - { id: S2, stage: P4, check: "out/ 에 있는 platform 마다 required_langs 전부 존재", on_fail: P3 }
      - { id: S3, stage: P4, check: "copy.csv headline 줄 수(headline_lines, 없으면 \\n 기준) <= 2", on_fail: P2 }
      - { id: S4, stage: P4, check: "legacy_feature 매칭 = 0 (카피 + OCR)", on_fail: P2 }
      - { id: S5, stage: P4, check: "no_em_dash_langs 카피 em dash(—) = 0, no_emoji_platforms 카피 이모지 = 0", on_fail: P2 }
      - { id: S6, stage: P4, check: "personal_data 매칭 = 0 (카피 + OCR)", on_fail: P3 }
      - { id: S7, stage: P4, check: "forbidden_colors 정확 일치 픽셀 = 0, OCR 시각(HH:MM) 은 status_time 만", on_fail: P3 }
      - { id: S8, stage: P4, check: "brand_forbidden 매칭 = 0 (카피 + OCR)", on_fail: P3 }
      - { id: S9, stage: P4, check: "out/{lang} PNG OCR 에 lang_foreign_script 글자 = 0 (언어 혼입)", on_fail: P3 }
    lang_foreign_script:            # 언어별로 나오면 안 되는 문자 (유니코드 스크립트 이름)
      "{언어 코드}": ["{스크립트 — 예: Hangul}"]
    ocr: { engine: macos-vision, targets: ["p3-make/raw/*.png", "p3-make/out/*.png"], lang_mix: { min_chars: 3, min_ratio: 0.6 } }
  qa:
    - { id: Q1, stage: P4, check: "범위 표(섹션 열 필수) 영역마다 해당 섹션 항목 >= 1", on_fail: P3 }
    - { id: Q2, stage: P4, check: "모든 행 절차·기대·우선 비어있지 않음, 우선 ∈ {P0,P1,P2}", on_fail: P3 }
    - { id: Q3, stage: P4, check: "머리 항목 수·P0/P1/P2 분포 = 실제 행 수", on_fail: P3 }
    - { id: Q4, stage: P4, check: "직전 버전 시트(app_repo 의 QA 폴더)와 항목 제목 중복 = 0", on_fail: P3 }
    - { id: Q5, stage: P5, check: "노션 파생본 체크박스 수 = 정본 행 수, sync-log notion_items = 정본 행 수, CSV ID 는 전부 정본에 존재", on_fail: P5 }
  events:
    - { id: E1, stage: P4, check: "헤더 = events.columns, 이름 = name_pattern, 이름 중복 0, 현재 시트의 removed 이름 부활 0", on_fail: P3 }
    - { id: E2, stage: P2, check: "scope.md 키 스펙(K-ID)마다 changes.md 행 >= 1, '측정 안 함' 행은 purpose(사유) 필수", on_fail: P1 }
    - { id: E3, stage: P4, check: "현재 시트 대비 추가·프로퍼티 변경된 이벤트의 purpose 비어 있음 = 0", on_fail: P3 }
    - { id: E4, stage: P4, check: "removed 아닌 이벤트의 프로퍼티 키 ∈ pii_props = 0", on_fail: P3 }
    - { id: A5, star: A, stage: P4, check: "removed 아닌 이벤트의 프로퍼티 키 ∈ content_props = 0 (사용자 원문이 분석 서버로 가지 않게)", on_fail: P3 }
    - { id: B6, star: B, stage: P4, check: "star_categories 이벤트 프로퍼티·enum 의 b_forbidden 매칭 = 0, probe_event 의 key 에 probe_guarded_values 새로 추가 = 0", on_fail: P2 }
    - { id: E7, stage: P4, check: "events-{version}.md 에 목적·퍼널·질문·커버리지 절 존재(비어 있지 않음), 시트의 미정 enum(…) 이벤트는 질문 절에 이름이 있음", on_fail: P3 }
    - { id: E8, stage: P4, check: "implemented=yes 이벤트는 앱 코드에 \"이름\" 리터럴 존재, 코드 호출(call_patterns) 중 시트에 없는 이름 = 0", on_fail: P3 }
    - { id: E9, stage: P4, report_only: true, check: "p4-check/analytics-live.json (judge 가 분석 도구 MCP 로 받은 발생량) 에서 implemented=yes 인데 0건인 이벤트 — 보고만", on_fail: P3 }

events:
  sheet: "{앱 리포 이벤트 시트 경로}/events.csv"   # 앱 리포 정본 (app_repo 기준)
  sheet_file: events.csv                          # runs/{slug}/p3-make/ 안 파일 이름
  columns: [event_name, category, description_ko, properties, platform, implemented, purpose, since]
  name_pattern: "^[a-z][a-z0-9]*(_[a-z0-9]+)+$"
  implemented_values: ["yes", "no", "removed"]
  platform_values: ["{플랫폼 값}"]
  # properties 셀: "key, key(a|b|…), key(ios)" — 괄호 안에 | 가 있으면 enum, 없으면 조건(플랫폼 등)
  pii_props: [email, name, user_name, nickname, phone, phone_number, device_name, ip, ip_address, location, latitude, longitude, lat, lng]
  content_props: ["{사용자 원문 콘텐츠 프로퍼티 이름}"]
  star_categories: ["{★ 조건을 검사할 이벤트 category}"]
  probe_event: { name: "{수요 측정(fake door) 이벤트 이름}", key: "{출처 프로퍼티}" }
  probe_guarded_values: ["{★B 에 걸리는 probe 값}"]
  code:
    roots: ["{앱 코드 루트}"]
    exclude_dirs: [build, node_modules, test]
    extensions: [.kt, .java, .swift, .js, .ts]
    call_patterns: ["{분석 호출 정규식 — 첫 캡처 = 이벤트 이름}"]
    ignore_names: [event_name]
  delivery_sections: [목적, 퍼널, 질문, 커버리지]
  changes_columns: [구분, event_name, category, 설명, properties, platform, purpose, 스펙 ID]
  change_kinds: [추가, 변경, 소거, 측정 안 함]

# ── 값의 출처 (플레이북 원칙 9) ─────────────────────────────
# 인터뷰 = 인터뷰에서 사용자가 답·승인한 값 · design.md 등 = 그 문서에 적힌 값 · 임의 = 문서에 없어 하네스가 정한 값 (확인 대상)
# 값을 채우면서 출처를 고친다. tests/sources.test.mjs 가 경로가 실제로 있는지 확인한다.
sources:
  retry.max_same_gate_fail: 임의
  review_after: 임의
  approval: 임의
  design_tokens: design.md
  gates.screenshots.spec: 임의
  dictionaries.a_forbidden: 임의
  dictionaries.a_signal: 임의
  dictionaries.b_forbidden: 임의
  dictionaries.legacy_feature: 임의
  dictionaries.personal_data: 임의
  b_screen: 임의
  star_flows: 임의
  gates.screenshots.lang_foreign_script: 임의
  gates.screenshots.ocr.lang_mix: 임의
  events.columns: 임의
  events.name_pattern: 임의
  events.pii_props: 임의
  events.content_props: 임의
  events.star_categories: 임의
  events.probe_event: 임의
  events.probe_guarded_values: 임의
  events.code.call_patterns: 임의
  events.delivery_sections: 임의
